appId: org.konshin.nextelectronrsc
productName: Next Electron RSC

directories:
  output: dist
  buildResources: assets

#asarUnpack:
#  - '**/.next/cache/**/*'
asar: false

files:
  - build
  - '.next/standalone/demo/**/*'
  # hoisted workspace: Next.js traces dependencies next to the app folder, not into it
  - '.next/standalone/node_modules/**/*'
  - '!.next/standalone/node_modules/electron'

mac:
  category: public.app-category.developer-tools
  target:
    target: dir
    arch:
      - arm64
#      - x64

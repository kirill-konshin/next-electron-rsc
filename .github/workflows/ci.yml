name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node .yarn/releases/yarn-4.9.1.cjs install --immutable
      - run: node .yarn/releases/yarn-4.9.1.cjs workspace next-electron-rsc test
